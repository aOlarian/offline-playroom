<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Playroom — Reparare</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#181534; color:#fff; font-family:system-ui,sans-serif; text-align:center; padding:24px; }
    .box { max-width:420px; }
    h1 { font-size:22px; margin:0 0 12px; color:#facc15; }
    p { color:#cbd5e1; line-height:1.5; }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size:56px">🧹</div>
    <h1>Curăț memoria jocurilor…</h1>
    <p id="msg">Un moment, te duc înapoi la jocuri.</p>
  </div>
  <script>
  // Pagina asta NU se afla in cache-ul vechi, deci ajunge mereu proaspata de pe server.
  // De aici stergem service worker-ul si cache-urile blocate, apoi reintram curat in aplicatie.
  (async () => {
    const msg = document.getElementById('msg');
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter((r) => r.scope === new URL('./', location.href).href).map((r) => r.unregister()));
      }
      if (window.caches) {
        const keys = await caches.keys();
        await Promise.all(keys.filter((k) => k.startsWith(`offline-playroom:${new URL('./', location.href).href}:`)).map((k) => caches.delete(k)));
      }
    } catch (e) {
      msg.textContent = 'Curățenia a dat eroare: ' + e.message;
    }
    location.replace('./?fresh=' + Date.now());
  })();
  </script>
</body>
</html>
